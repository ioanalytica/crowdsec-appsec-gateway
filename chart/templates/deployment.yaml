---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appsec-gateway.name" . }}
  labels:
    {{- include "appsec-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "appsec-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "appsec-gateway.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LAPI_URL
              value: {{ .Values.env.lapiUrl | quote }}
            - name: APPSEC_URL
              value: {{ .Values.env.appsecUrl | quote }}
            - name: API_KEY_FILE
              value: /secrets/crowdsec/{{ .Values.apiKeySecret.key }}
            - name: TRUSTED_CIDRS
              value: {{ join "," .Values.env.trustedCIDRs | quote }}
            - name: TIMEOUT_SECONDS
              value: {{ .Values.env.timeoutSeconds | quote }}
          volumeMounts:
            - name: api-key
              mountPath: /secrets/crowdsec
              readOnly: true
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: api-key
          secret:
            secretName: {{ .Values.apiKeySecret.name }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
